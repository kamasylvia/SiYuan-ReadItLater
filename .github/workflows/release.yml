name: Create Release on Tag Push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          plugin_version="$(node -p "require('./plugin.json').version")"

          if [[ "$GITHUB_REF_NAME" != v* || -z "$tag_version" ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME (expected v<version>)"
            exit 1
          fi

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match package.json ($package_version)"
            exit 1
          fi

          if [[ "$tag_version" != "$plugin_version" ]]; then
            echo "Tag version ($tag_version) does not match plugin.json ($plugin_version)"
            exit 1
          fi

          echo "Release version validated: $tag_version"

      - name: Build production package
        run: npm run build

      - name: Create package.zip
        run: zip -r package.zip index.js index.css plugin.json i18n.json i18n README.md README.zh-CN.md icon.png preview.png

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "package.zip"
          generateReleaseNotes: true
          body: |
            ## Install

            Download `package.zip` from the assets below, then in SiYuan open `Settings - Marketplace` and use `Import plugin` to install it manually. Alternatively, search "ReadItLater" in the SiYuan marketplace.

            ## Usage

            - Click the ReadItLater icon in the left dock bar (or run `Create from clipboard` from the command palette) to clip the clipboard content into a new document inside the inbox directory.
            - `Create from batch in clipboard` creates one note per URL from a batch of delimiter-separated URLs.
            - `Insert at the cursor position` inserts the clipped content into the focused document at the cursor.
            - Configure the target notebook, inbox directory, templates and content types under `Settings - Plugins - ReadItLater`.

            ## 安装

            下载附件中的 `package.zip`,在思源笔记打开 `设置 - 集市`,使用 `导入插件` 手动安装;也可在思源集市中直接搜索 ReadItLater。

            ## 使用

            - 点击左侧停靠栏的 ReadItLater 图标(或命令面板运行 `从剪贴板创建`),将剪贴板内容剪藏为收件箱目录下的新文档。
            - `从剪贴板批量创建`:批量 URL(以设置中的分隔符分隔)一次生成多条笔记。
            - `插入到光标位置`:将剪藏内容插入当前光标所在文档。
            - 目标笔记本、收件箱路径、模板与内容类型均在 `设置 - 插件 - 稍后读` 中配置。

            Full documentation: see the README in the repository.
          token: ${{ secrets.GITHUB_TOKEN }}
